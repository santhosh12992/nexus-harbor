version = "1.4"

[metadata]
name = "tpu-kernel-speedup-attention-v6e"
description = "Iterative Pallas TPU kernel optimization with hardware profiler feedback."
author = "smuralik"
tags = ["nexus", "tpu", "xprof", "jax", "pallas", "attention", "iterative"]
benchmark_version = "2.0.0"

[environment]
image = "gcr.io/google.com/cloud-tpu/jax-community:latest"
timeout_sec = 600
cpus = 2
memory_mb = 16384
gpus = 0

[verifier]
timeout_sec = 300

artifacts = [
  "/workspace/optimized_kernel.py",
  "/workspace/baseline_kernel.py",
  "/workspace/profiler_history.json",
]

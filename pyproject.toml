[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-harbor"
version = "0.1.0"
description = "Minimal POC for evaluating Google Antigravity custom skills with Harbor"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "harbor>=0.21.0",
    "google-antigravity>=0.1.1",
    "pyyaml>=6.0.2",
]
